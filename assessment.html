<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7ff">
  <title>あなたのいいところ診断</title>
  <link rel="stylesheet" href="assessment.css">
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <a class="brand" href="#" aria-label="あなたのいいところ診断 ホーム">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>あなたのいいところ診断</span>
      </a>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">A LITTLE REMINDER</p>
      <h1 id="page-title">あなたのいいところは？</h1>
      <p class="lead">名前を入れて、あなたの素敵なところを見つけてみましょう。</p>
    </section>

    <section class="quiz-card" aria-label="診断">
      <label class="input-label" for="user-name">診断したい名前</label>
      <div class="input-row">
        <input type="text" id="user-name" maxlength="20" autocomplete="name" placeholder="例：花子">
        <button type="button" id="assessment">診断する <span aria-hidden="true">→</span></button>
      </div>
      <p class="small-note">名前を入力してボタンを押してください</p>
    </section>

    <section id="result-area" aria-live="polite"></section>
    <div id="tweet-area"></div>
    <p class="page-foot">あなたらしさを、ちょっと好きになるきっかけに。</p>
  </main>
  <script src="assessment.js"></script>
</body>
</html>
